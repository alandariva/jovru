name: Security audit

# New advisories appear without code changes, so the audit also runs weekly.
on:
  schedule:
    - cron: "0 6 * * 1"
  # Release branches are audited by the CI when their pull request opens.
  push:
    branches-ignore: ["release/**"]
    paths: [Cargo.lock, "**/Cargo.toml", deny.toml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cargo-deny:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check
          arguments: --locked
