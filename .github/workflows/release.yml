name: Release

# Push a tag such as v0.1.0 to build the Windows and Linux binaries and draft a
# GitHub Release. Review the draft before publishing it.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo xtask check
      - run: cargo build --release --locked --bin jykre
      - name: Package
        shell: pwsh
        run: |
          $name = "jykre-studio-${env:GITHUB_REF_NAME}-windows-x86_64"
          New-Item -ItemType Directory -Force dist/$name | Out-Null
          Copy-Item target/release/jykre.exe, LICENSE, README.md dist/$name
          # The SQL catalogs the editor reads at run time, next to the executable.
          Copy-Item -Recurse catalog dist/$name/catalog
          Compress-Archive -Path dist/$name -DestinationPath dist/$name.zip
          (Get-FileHash dist/$name.zip -Algorithm SHA256).Hash.ToLower() + "  $name.zip" |
            Out-File -Encoding ascii dist/$name.zip.sha256
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows
          path: dist/*.zip*
          if-no-files-found: error

  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install GPUI system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libx11-xcb-dev libxcb1-dev libfontconfig-dev libfreetype-dev \
            libvulkan-dev libasound2-dev libdbus-1-dev libssl-dev
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo xtask check
      - run: cargo build --release --locked --bin jykre
      - name: Package
        run: |
          name="jykre-studio-${GITHUB_REF_NAME}-linux-x86_64"
          mkdir -p "dist/$name"
          cp target/release/jykre LICENSE README.md "dist/$name"
          # The SQL catalogs the editor reads at run time, next to the executable.
          cp -R catalog "dist/$name/catalog"
          tar -czf "dist/$name.tar.gz" -C dist "$name"
          (cd dist && sha256sum "$name.tar.gz" > "$name.tar.gz.sha256")
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux
          path: dist/*.tar.gz*
          if-no-files-found: error

  # Drafted only after every platform builds, so a release never ships partial.
  draft:
    needs: [windows, linux]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME" --draft --generate-notes
          --repo "$GITHUB_REPOSITORY" dist/*
