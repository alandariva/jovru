services:
  postgres-min:
    image: postgres:14
    environment:
      POSTGRES_USER: jovru
      POSTGRES_PASSWORD: jovru-test
      POSTGRES_DB: jovru
    ports: ["127.0.0.1::5432"]
    volumes:
      - ./tests/fixtures/postgres.sql:/docker-entrypoint-initdb.d/fixture.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U jovru -d jovru"]
      interval: 2s
      timeout: 2s
      retries: 90
  postgres-max:
    image: postgres:18
    environment:
      POSTGRES_USER: jovru
      POSTGRES_PASSWORD: jovru-test
      POSTGRES_DB: jovru
    ports: ["127.0.0.1::5432"]
    volumes:
      - ./tests/fixtures/postgres.sql:/docker-entrypoint-initdb.d/fixture.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U jovru -d jovru"]
      interval: 2s
      timeout: 2s
      retries: 90
  mysql-lts:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: jovru-test
      MYSQL_DATABASE: jovru
      MYSQL_USER: jovru
      MYSQL_PASSWORD: jovru-test
    ports: ["127.0.0.1::3306"]
    volumes:
      - ./tests/fixtures/mysql.sql:/docker-entrypoint-initdb.d/fixture.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -pjovru-test"]
      interval: 2s
      timeout: 2s
      retries: 90
  mysql-current:
    image: mysql:9.7
    environment:
      MYSQL_ROOT_PASSWORD: jovru-test
      MYSQL_DATABASE: jovru
      MYSQL_USER: jovru
      MYSQL_PASSWORD: jovru-test
    ports: ["127.0.0.1::3306"]
    volumes:
      - ./tests/fixtures/mysql.sql:/docker-entrypoint-initdb.d/fixture.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -pjovru-test"]
      interval: 2s
      timeout: 2s
      retries: 90
