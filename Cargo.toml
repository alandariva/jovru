[package]
name = "jykre"
description = "Native Rust and GPUI desktop workspace for PostgreSQL, MySQL and Databricks"
readme = "README.md"
keywords = ["database", "sql", "gpui", "postgresql", "databricks"]
categories = ["database", "gui"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[workspace]
resolver = "3"
members = ["crates/*", "xtask"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"
repository = "https://github.com/alandariva/jykre-studio"
authors = ["Alan de Oliveira"]
publish = false

[workspace.dependencies]
async-trait = "0.1"
secrecy = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "time", "process", "io-util", "fs", "sync"] }
futures-util = "0.3"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "tls-rustls-ring-native-roots"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
tokio-util = { version = "0.7", features = ["rt"] }
uuid = { version = "1", features = ["v4", "serde"] }
tracing = { version = "0.1", default-features = false, features = ["std", "attributes"] }
tracing-subscriber = { version = "0.3", default-features = false, features = ["std", "fmt", "registry", "env-filter", "json", "tracing-log"] }
tracing-appender = "0.2"
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }

[dependencies]
gpui-kit = "0.9.0"
jykre-core = { path = "crates/core" }
jykre-driver-postgres = { path = "crates/driver-postgres" }
jykre-driver-mysql = { path = "crates/driver-mysql" }
jykre-driver-databricks = { path = "crates/driver-databricks" }
jykre-storage = { path = "crates/storage" }
jykre-secrets = { path = "crates/secrets" }
tokio.workspace = true
serde_json.workspace = true
sys-locale = "0.3"
dirs = "7"
tracing.workspace = true
tracing-subscriber.workspace = true
tracing-appender.workspace = true

[dev-dependencies]
criterion.workspace = true

# Hot paths with criterion (ADR-0010). `cargo xtask check --full` runs them in
# quick mode; compare a change with `--save-baseline main` / `--baseline main`.
[[bench]]
name = "hot_paths"
harness = false
