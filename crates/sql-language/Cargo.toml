[package]
name = "jykre-sql-language"
description = "The SQL editor's language features (completion, hover, formatting), apart from what runs queries"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
default = ["sqruff"]
# Format with sqruff-lib (N010); without it, Format uses a simple built-in
# layout that changes only whitespace and keyword case.
sqruff = ["dep:sqruff-lib"]

[dependencies]
jykre-core = { path = "../core" }
jykre-sql = { path = "../sql" }
serde.workspace = true
serde_json.workspace = true
sqruff-lib = { workspace = true, optional = true }
