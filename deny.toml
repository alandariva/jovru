[advisories]
version = 2
# Every exception needs a reason and a review date. Remove it as soon as an
# upstream release drops the crate. Only `unmaintained` notices are accepted
# here; vulnerabilities must be fixed.
#
# Reviewed 2026-11-02 after `cargo update` with gpui-kit 0.9.0: none of these
# crates has a maintained replacement reachable from our direct dependencies.
# Next review: 2027-02-01.
ignore = [
    # GPUI (gpui-base, gpui-component): replace with web-time upstream.
    { id = "RUSTSEC-2024-0384", reason = "instant via gpui-base/gpui-component; no upstream fix yet" },
    # GPUI (gpui-component) and image/exr: proc-macro, no runtime exposure.
    { id = "RUSTSEC-2024-0436", reason = "paste via gpui-component and image; no upstream fix yet" },
    # GPUI asset HTTP client (gpui-pre-reqwest).
    { id = "RUSTSEC-2025-0134", reason = "rustls-pemfile via gpui-pre-reqwest; no upstream fix yet" },
    # GPUI SVG and text rendering (resvg/usvg, cosmic-text, fontdb).
    { id = "RUSTSEC-2026-0206", reason = "rustybuzz via usvg/resvg in GPUI; no upstream fix yet" },
    { id = "RUSTSEC-2026-0192", reason = "ttf-parser via fontdb/cosmic-text in GPUI; no upstream fix yet" },
    # zbus split crates: GPUI Linux accessibility (zbus 5) and the keyring
    # Linux Secret Service backend (zbus 4). Merged into zbus 6 upstream.
    { id = "RUSTSEC-2026-0371", reason = "zbus_names via accesskit (GPUI) and keyring Secret Service; needs zbus 6 upstream" },
    { id = "RUSTSEC-2026-0370", reason = "zvariant via accesskit (GPUI) and keyring Secret Service; needs zbus 6 upstream" },
    { id = "RUSTSEC-2026-0372", reason = "zvariant_derive via accesskit (GPUI) and keyring Secret Service; needs zbus 6 upstream" },
]

[licenses]
version = 2
allow = ["MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause", "ISC", "Zlib", "MPL-2.0", "Unicode-3.0", "BSL-1.0", "CC0-1.0", "CDLA-Permissive-2.0", "Unlicense", "0BSD"]
private = { ignore = true }

[bans]
multiple-versions = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
